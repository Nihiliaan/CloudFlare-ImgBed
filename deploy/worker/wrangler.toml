name = "cloudflare-imgbed"
main = "index.js"
compatibility_date = "2024-08-21"
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "img_d1"
database_name = "img_d1"
database_id = "12e2dbe9-1615-41a4-bec1-0cd1af78d5a1"

[[kv_namespaces]]
binding = "img_url"
id = "1a19c7ce04a242fa969e81a76421ce25"

[[r2_buckets]]
binding = "img_r2"
bucket_name = "image-server"

[vars]
# Secret 类型的变量在部署后单独上传，不写入此配置。
